services:
  node1:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=8080
      - MONGO_URI=${MONGO_URI}
      - ETHEREUM_RPC_URL=${ETHEREUM_RPC_URL}
      - ETHEREUM_PRIVATE_KEY=${ETHEREUM_PRIVATE_KEY}
      - PLATFORM_CONTRACT_ADDRESS=${PLATFORM_CONTRACT_ADDRESS}
      - TRANSACTION_ENCRYPTION_KEY=${TRANSACTION_ENCRYPTION_KEY}
      - NODE_ID=node-1
      - NODE_PEERS=http://node2:8080,http://node3:8080
    volumes:
      - .:/app
      - /app/node_modules
    command: ['npm', 'run', 'start:prod']
    depends_on:
      - mongo

  node2:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=8080
      - MONGO_URI=${MONGO_URI}
      - ETHEREUM_RPC_URL=${ETHEREUM_RPC_URL}
      - ETHEREUM_PRIVATE_KEY=${ETHEREUM_PRIVATE_KEY}
      - PLATFORM_CONTRACT_ADDRESS=${PLATFORM_CONTRACT_ADDRESS}
      - TRANSACTION_ENCRYPTION_KEY=${TRANSACTION_ENCRYPTION_KEY}
      - NODE_ID=node-2
      - NODE_PEERS=http://node1:8080,http://node3:8080
    volumes:
      - .:/app
      - /app/node_modules
    command: ['npm', 'run', 'start:prod']
    depends_on:
      - mongo

  node3:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=8080
      - MONGO_URI=${MONGO_URI}
      - ETHEREUM_RPC_URL=${ETHEREUM_RPC_URL}
      - ETHEREUM_PRIVATE_KEY=${ETHEREUM_PRIVATE_KEY}
      - PLATFORM_CONTRACT_ADDRESS=${PLATFORM_CONTRACT_ADDRESS}
      - TRANSACTION_ENCRYPTION_KEY=${TRANSACTION_ENCRYPTION_KEY}
      - NODE_ID=node-3
      - NODE_PEERS=http://node1:8080,http://node2:8080
    volumes:
      - .:/app
      - /app/node_modules
    command: ['npm', 'run', 'start:prod']
    depends_on:
      - mongo

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - node1
      - node2
      - node3

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

volumes:
  mongo_data:
